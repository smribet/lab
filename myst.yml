# MyST configuration for the M&M 2026 X11 short-course companion site.
# See: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: ribet_group
  title: Ribet
  description: >
    Companion site for the M&M 2026 Sunday short course X11 — Nanobeam
    Diffraction and 4D-STEM Analysis of Crystalline and Disordered Materials.
  keywords:
    - electron microscopy
    - STEM
    - 4D-STEM
    - nanobeam electron diffraction
    - strain mapping
    - orientation mapping
  github: https://github.com/smribet/ribet_group
  exclude:
    - README.md
  toc:
    - file: index.md
    - file: team.md
    - file: research.md
    - file: users.md
    - file: publications.md
    - file: open-source-code.md
    - file: funding.md
site:
  template: book-theme
  title: Ribet
  parts:
    footer: footer.md
  options:
    # Custom theming — see ./style.css
    style: ./style.css
    logo: ./assets/logo/frog_logo.png
    logo_text: Ribet
    favicon: ./assets/logo/frog_logo.png
    folders: true
    outline_maxdepth: 2
    hide_toc: true
    hide_footer_links: true
  nav:
    - title: Team
      url: /team
    - title: Research
      url: /research
    - title: Users @ the MF
      url: /users
    - title: Publications
      url: /publications
    - title: Resources
      children:
        - title: Open-Source Code
          url: /open-source-code
        - title: Funding
          url: /funding
