# MyST configuration for the M&M 2026 X11 short-course companion site.
# See: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: ribet_group
  title: Ribet Research 
  description: >
    Companion site for the M&M 2026 Sunday short course X11 — Nanobeam
    Diffraction and 4D-STEM Analysis of Crystalline and Disordered Materials.
  keywords:
    - electron microscopy
    - STEM
    - 4D-STEM
    - nanobeam electron diffraction
    - strain mapping
    - orientation mapping
  github: https://github.com/smribet/ribet_group
  exclude:
    - README.md
  toc:
    - file: index.md
    - file: team.md
    - file: users.md
    - file: publications.md
    - file: agenda.md
    - file: resources.md
site:
  template: book-theme
  title: Ribet Research 
  options:
    # Custom theming — see ./style.css
    style: ./style.css
    logo_text: Ribet Research 
    folders: true
    outline_maxdepth: 2
    hide_toc: true
    hide_footer_links: true
  nav:
    - title: Team
      url: /team
    - title: Users
      url: /users
    - title: Publications
      url: /publications
    - title: Resources
      url: /resources
